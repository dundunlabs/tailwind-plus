name: publish

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm --filter @dundunlabs/catalyst-ui build
      - run: pnpm --filter @dundunlabs/catalyst-ui test

      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org/
      - run: pnpm --filter @dundunlabs/catalyst-ui publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
